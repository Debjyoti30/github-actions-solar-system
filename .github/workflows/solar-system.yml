name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: 'superuser'
  MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 20
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml
    code-coverage:
      name: code coverage of the unit test
      # needs: [unit-testing]
      runs-on: ubuntu-latest
      steps:
       - name: checkout the repository
         id: code_coverage_repo_checkout
         uses: actions/checkout@v4
       - name: install nodejs for code coverage
         id: nodejs_setup_code_coverage
         uses: actions/setup-node@v4
       - name: install nodejs dependency
         id: install_npm_code_coverage
         run: npm install
       - name: Run code coverage
         continue-on-error: true
         id: run_code_coverage
         run: npm run coverage
       - name: upload test coverage
         id: upload_test_coverage
         uses: actions/upload-artifact@v4
         with:
          name: test-coverage-result-felicia
          path: coverage
          retention-days: 5
